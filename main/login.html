<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Login Deadline creator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="centered">
  <main class="auth-card">
    <h1 class="brand">Deadline creator</h1>
    <h2>Login</h2>
    <form onsubmit="event.preventDefault(); login();">
      <label>Email<input id="loginEmail" type="email" required></label>
      <label>Password<input id="loginPassword" type="password" required></label>
      <div class="form-actions">
        <button class="btn primary" type="submit">Login</button>
        <a class="link" href="signup.html">Create account</a>
      </div>
    </form>
    <div id="authMsg" class="auth-msg"></div>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
