<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Deadline Defender</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f3f3; }
        .font-headline { font-family: 'Manrope', sans-serif; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6">

    <div class="bg-white p-12 rounded-[3rem] max-w-md w-full shadow-2xl">
        <div class="mb-10">
            <h1 class="font-headline font-black text-3xl text-[#005da7] mb-2">Welcome Back</h1>
            <p class="text-slate-500 text-sm font-medium">Sign in to resume your progress.</p>
        </div>

        <div class="space-y-4 mb-8">
            <input type="email" id="login-email" placeholder="Email Address" class="w-full p-4 bg-slate-50 rounded-2xl border-none outline-none focus:ring-2 focus:ring-[#005da7] transition-all">
            <input type="password" id="login-password" placeholder="Password" class="w-full p-4 bg-slate-50 rounded-2xl border-none outline-none focus:ring-2 focus:ring-[#005da7] transition-all">
        </div>

        <button onclick="handleLogin()" class="w-full py-4 bg-[#005da7] text-white rounded-2xl font-bold shadow-lg shadow-blue-100 hover:bg-blue-700 transition-all">Enter Workspace</button>
        
        <p class="mt-6 text-center text-sm text-slate-400 font-medium">
            New here? <a href="signup.html" class="text-[#005da7] font-bold">Create Account</a>
        </p>
    </div>

    <script>
        const _sb = supabase.createClient('https://zdahbfsojemtyhsbpcji.supabase.co/', 'sb_publishable_YO03kzP1YH9r_Bv3m5_9ng_dnBYt6Sx');

        async function handleLogin() {
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;

            const { data, error } = await _sb.auth.signInWithPassword({ email, password });
            if (error) alert(error.message);
            else window.location.href = 'index.html'; // Redirect to dashboard
        }
    </script>
</body>
</html>
