<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deadline Defender</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #F9F9F9; }
        .primary-blue { color: #4A90E2; }
        .bg-primary-blue { background-color: #4A90E2; }
    </style>
</head>
<body class="text-slate-800">

    <div id="auth-overlay" class="fixed inset-0 bg-slate-900/90 z-[100] flex items-center justify-center p-4">
        <div class="bg-white p-8 rounded-3xl max-w-md w-full shadow-2xl">
            <h2 class="font-bold text-2xl mb-2">Student Login</h2>
            <p class="text-slate-500 mb-6">Enter your details to track your deadlines.</p>
            <input type="email" id="email" placeholder="Email" class="w-full p-4 mb-3 border rounded-xl outline-none focus:ring-2 focus:ring-blue-400">
            <input type="password" id="password" placeholder="Password" class="w-full p-4 mb-6 border rounded-xl outline-none focus:ring-2 focus:ring-blue-400">
            <div class="flex gap-3">
                <button onclick="handleSignUp()" class="flex-1 py-4 border-2 border-slate-200 rounded-xl font-bold hover:bg-slate-50">Sign Up</button>
                <button onclick="handleLogin()" class="flex-1 py-4 bg-primary-blue text-white rounded-xl font-bold shadow-lg shadow-blue-200">Login</button>
            </div>
        </div>
    </div>

    <nav class="p-6 flex justify-between items-center bg-white border-b">
        <div class="flex items-center gap-2">
            <span class="material-icons-round primary-blue text-3xl">verified_user</span>
            <h1 class="font-bold text-xl tracking-tight">Deadline Defender</h1>
        </div>
        <button onclick="handleLogout()" class="text-slate-400 font-medium hover:text-red-500 transition-colors">Logout</button>
    </nav>

    <main class="max-w-4xl mx-auto p-6">
        <header class="flex justify-between items-end mb-8">
            <div>
                <h2 class="text-3xl font-extrabold">Today's Deadlines</h2>
                <p id="user-display" class="text-slate-500">Welcome back!</p>
            </div>
            <button onclick="showAddModal()" class="bg-primary-blue text-white px-6 py-3 rounded-xl font-bold shadow-lg shadow-blue-200 flex items-center gap-2">
                <span class="material-icons-round">add</span> Add New
            </button>
        </header>

        <div id="deadline-list" class="space-y-4">
            <p class="text-slate-400 text-center py-10">No deadlines found. Add one to get started!</p>
        </div>
    </main>

    <div id="add-modal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
        <div class="bg-white p-8 rounded-3xl max-w-md w-full">
            <h3 class="font-bold text-xl mb-4">New Deadline</h3>
            <input type="text" id="task-title" placeholder="Assignment Name" class="w-full p-4 mb-3 border rounded-xl">
            <input type="text" id="task-subject" placeholder="Subject/Class" class="w-full p-4 mb-3 border rounded-xl">
            <input type="datetime-local" id="task-date" class="w-full p-4 mb-6 border rounded-xl">
            <div class="flex gap-3">
                <button onclick="closeAddModal()" class="flex-1 py-3 text-slate-500 font-bold">Cancel</button>
                <button onclick="submitDeadline()" class="flex-1 py-3 bg-primary-blue text-white rounded-xl font-bold">Save Task</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
