<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deadline Defender</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <header>
        <div class="logo">🛡️ Deadline Defender</div>
        <nav id="nav-links">
            <button id="logout-btn" class="hidden">Logout</button>
        </nav>
    </header>

    <div class="container">
        <div id="auth-screen" class="card">
            <h2 id="auth-title">Welcome Back</h2>
            <div class="form-group">
                <input type="email" id="email" placeholder="Email Address">
                <input type="password" id="password" placeholder="Password">
                <button id="login-btn" class="btn-primary">Login</button>
                <button id="signup-btn" class="btn-secondary">Create Account</button>
            </div>
            <p id="auth-msg"></p>
        </div>

        <div id="dash-screen" class="hidden">
            <div class="dash-header">
                <h2>Your Deadlines</h2>
                <button id="add-task-btn" class="btn-add">+ Add New</button>
            </div>

            <div id="task-list">
                </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
