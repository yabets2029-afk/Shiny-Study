<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deadline Defender | Cognitive Architect</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1" rel="stylesheet">
    <style>
        :root { --primary: #005da7; --surface: #f3f3f3; }
        body { font-family: 'Inter', sans-serif; background-color: var(--surface); color: #1a1c1c; }
        .font-headline { font-family: 'Manrope', sans-serif; }
        .glass-card { background: #ffffff; border-radius: 1.5rem; transition: transform 0.3s ease; }
        .glass-card:hover { transform: translateY(-4px); }
        .no-border { border: none !important; }
    </style>
</head>
<body class="antialiased">

    <div id="auth-overlay" class="fixed inset-0 bg-[#1a1c1c]/95 z-[100] flex items-center justify-center p-6">
        <div class="bg-white p-10 rounded-[2.5rem] max-w-md w-full shadow-2xl">
            <div class="mb-8">
                <h2 id="auth-title" class="font-headline font-extrabold text-3xl mb-2 text-[#005da7]">Create Account</h2>
                <p id="auth-subtitle" class="text-slate-500 font-medium text-sm">Organize your academic life with surgical precision.</p>
            </div>
            
            <div class="space-y-4 mb-8">
                <input type="email" id="email" placeholder="Email" class="w-full p-4 bg-slate-100 rounded-2xl no-border focus:ring-2 focus:ring-[#005da7] transition-all outline-none">
                <input type="password" id="password" placeholder="Password" class="w-full p-4 bg-slate-100 rounded-2xl no-border focus:ring-2 focus:ring-[#005da7] transition-all outline-none">
                <input type="password" id="confirm-password" placeholder="Confirm Password" class="w-full p-4 bg-slate-100 rounded-2xl no-border focus:ring-2 focus:ring-[#005da7] transition-all outline-none">
            </div>

            <button onclick="handleAuth()" id="auth-btn" class="w-full py-4 bg-[#005da7] text-white rounded-2xl font-bold shadow-xl shadow-blue-200 hover:bg-blue-700 transition-all">Start Designing</button>
            <button onclick="toggleAuthMode()" id="toggle-btn" class="w-full mt-4 text-xs font-bold text-slate-400 hover:text-[#005da7] uppercase tracking-widest">Already a member? Login</button>
        </div>
    </div>

    <div class="flex min-h-screen">
        <aside class="w-72 hidden lg:flex flex-col p-8 fixed h-full bg-white">
            <div class="flex items-center gap-3 mb-16">
                <span class="material-symbols-outlined text-[#005da7] text-4xl">architecture</span>
                <h1 class="font-headline font-black text-xl tracking-tight text-[#005da7]">Defender</h1>
            </div>
            <nav class="space-y-4 flex-1">
                <a href="#" class="flex items-center gap-4 p-4 bg-slate-50 text-[#005da7] rounded-2xl font-bold">
                    <span class="material-symbols-outlined">grid_view</span> Dashboard
                </a>
            </nav>
            <button onclick="logout()" class="flex items-center gap-4 p-4 text-slate-400 hover:text-red-500 font-bold transition-all">
                <span class="material-symbols-outlined">logout</span> Sign Out
            </button>
        </aside>

        <main class="flex-1 lg:ml-72 p-6 md:p-12">
            <header class="flex justify-between items-end mb-16">
                <div>
                    <span id="header-date" class="text-[10px] font-bold text-slate-400 uppercase tracking-[0.2em]">Monday, May 12</span>
                    <h2 class="text-5xl font-headline font-black mt-3">Today's Deadlines</h2>
                </div>
                <button onclick="openModal()" class="bg-[#005da7] text-white px-8 py-4 rounded-2xl font-bold shadow-2xl shadow-blue-200 hover:scale-105 transition-all flex items-center gap-3">
                    <span class="material-symbols-outlined">add</span> Create Task
                </button>
            </header>

            <div id="deadline-grid" class="grid grid-cols-1 xl:grid-cols-2 gap-8">
                </div>
        </main>
    </div>

    <div id="modal" class="hidden fixed inset-0 bg-slate-900/40 backdrop-blur-md z-[110] flex items-center justify-center p-6">
        <div class="bg-white rounded-[3rem] p-10 max-w-lg w-full shadow-2xl">
            <h3 class="text-2xl font-headline font-extrabold mb-8">New Objective</h3>
            <div class="space-y-4 mb-10">
                <input type="text" id="task-title" placeholder="Assignment Title" class="w-full p-4 bg-slate-50 rounded-2xl no-border outline-none">
                <input type="text" id="task-subject" placeholder="Subject/Class" class="w-full p-4 bg-slate-50 rounded-2xl no-border outline-none">
                <input type="datetime-local" id="task-date" class="w-full p-4 bg-slate-50 rounded-2xl no-border outline-none">
            </div>
            <div class="flex gap-4">
                <button onclick="closeModal()" class="flex-1 py-4 font-bold text-slate-400">Discard</button>
                <button onclick="saveTask()" class="flex-1 py-4 bg-[#005da7] text-white rounded-2xl font-bold shadow-lg shadow-blue-100">Establish Deadline</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
