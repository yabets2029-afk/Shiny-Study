<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Deadline creator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <h1 class="brand">Classic Tasks</h1>
      <nav>
        <button id="logoutBtn" class="btn ghost">Logout</button>
      </nav>
    </div>
  </header>

  <main class="container main-grid">
    <section class="panel form-panel">
      <h2>Create Task</h2>
      <form id="taskForm" class="task-form" onsubmit="event.preventDefault(); addTask();">
        <label>Topic<input id="topic" required></label>
        <label>Subject<input id="subject"></label>
        <label>Teacher<input id="teacher"></label>
        <label>Date and Time<input id="dateTime" type="datetime-local" required></label>
        <label>Estimated Time (mins)<input id="estimatedTime" type="number" min="1"></label>
        <label>Difficulty
          <input id="difficulty" type="range" min="1" max="5" value="3">
        </label>
        <label>Priority
          <select id="priority">
            <option value="Low">Low</option>
            <option value="Medium" selected>Medium</option>
            <option value="High">High</option>
          </select>
        </label>
        <label>Task Type<input id="taskType"></label>
        <label>Description<textarea id="description" rows="4"></textarea></label>
        <div class="form-actions">
          <button class="btn primary" type="submit">Add Task</button>
          <button class="btn" type="button" onclick="clearForm()">Clear</button>
        </div>
      </form>
    </section>

    <section class="panel list-panel">
      <h2>Your Tasks</h2>
      <div id="taskList" class="task-list"></div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <small>Classic Tasks — friendly task manager</small>
    </div>
  </footer>

  <script type="module" src="app.js"></script>
</body>
</html>
