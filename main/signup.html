<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Signup Deadline creator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="centered">
  <main class="auth-card">
    <h1 class="brand">Deadline creator</h1>
    <h2>Create Account</h2>
    <form onsubmit="event.preventDefault(); signup();">
      <label>Email<input id="signupEmail" type="email" required></label>
      <label>Password<input id="signupPassword" type="password" required minlength="6"></label>
      <label>Confirm Password<input id="signupConfirm" type="password" required minlength="6"></label>
      <div class="form-actions">
        <button class="btn primary" type="submit">Sign up</button>
        <a class="link" href="login.html">Already have an account</a>
      </div>
    </form>
    <div id="authMsg" class="auth-msg"></div>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
