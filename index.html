<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deadline Defender | Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f3f3; }
        .font-headline { font-family: 'Manrope', sans-serif; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="text-slate-900 overflow-x-hidden">

    <div id="auth-overlay" class="fixed inset-0 bg-slate-900/95 z-[100] flex items-center justify-center p-4">
        <div class="bg-white p-10 rounded-[2rem] max-w-md w-full shadow-2xl">
            <div class="mb-8 text-center">
                <div class="inline-flex p-3 bg-blue-50 rounded-2xl mb-4">
                    <span class="material-icons-round text-blue-600 text-3xl">architecture</span>
                </div>
                <h2 id="auth-title" class="font-headline font-extrabold text-2xl">Create Account</h2>
                <p id="auth-subtitle" class="text-slate-500 text-sm">Organize your academic life with precision.</p>
            </div>
            
            <div class="space-y-4 mb-6">
                <input type="email" id="email" placeholder="Email Address" class="w-full p-4 bg-slate-50 border-none rounded-2xl outline-none focus:ring-2 focus:ring-blue-500 transition-all">
                <input type="password" id="password" placeholder="Password" class="w-full p-4 bg-slate-50 border-none rounded-2xl outline-none focus:ring-2 focus:ring-blue-500 transition-all">
                <input type="password" id="confirm-password" placeholder="Confirm Password" class="w-full p-4 bg-slate-50 border-none rounded-2xl outline-none focus:ring-2 focus:ring-blue-500 transition-all">
            </div>

            <button onclick="handleAuthAction()" id="auth-main-btn" class="w-full py-4 bg-[#005da7] text-white rounded-2xl font-bold shadow-lg shadow-blue-200 hover:bg-blue-700 transition-all">Create Account</button>
            <button onclick="toggleAuthMode()" id="auth-toggle-btn" class="w-full mt-4 text-sm font-semibold text-slate-400 hover:text-blue-600 transition-colors">Already have an account? Login</button>
        </div>
    </div>

    <div class="flex min-h-screen">
        <aside class="w-64 bg-white border-r border-slate-200 hidden lg:flex flex-col p-6 fixed h-full">
            <div class="flex items-center gap-3 mb-12">
                <span class="material-icons-round text-[#005da7] text-3xl">verified_user</span>
                <h1 class="font-headline font-black text-xl tracking-tight text-[#005da7]">Defender</h1>
            </div>
            <nav class="space-y-2 flex-1">
                <a href="#" class="flex items-center gap-3 p-4 bg-blue-50 text-blue-700 rounded-2xl font-bold">
                    <span class="material-icons-round">dashboard</span> Dashboard
                </a>
            </nav>
            <button onclick="handleLogout()" class="flex items-center gap-3 p-4 text-slate-400 hover:text-red-500 font-bold transition-colors">
                <span class="material-icons-round">logout</span> Logout
            </button>
        </aside>

        <main class="flex-1 lg:ml-64 p-4 md:p-10">
            <header class="flex justify-between items-end mb-12">
                <div>
                    <span id="date-now" class="text-xs font-bold text-slate-400 uppercase tracking-widest">October 24, 2024</span>
                    <h2 class="text-4xl font-headline font-black mt-2">Today's Focus</h2>
                </div>
                <button onclick="openModal()" class="bg-[#005da7] text-white px-6 py-4 rounded-2xl font-bold shadow-xl shadow-blue-100 flex items-center gap-2 hover:scale-105 transition-transform">
                    <span class="material-icons-round">add</span> New Deadline
                </button>
            </header>

            <div id="deadline-container" class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="col-span-full py-20 text-center text-slate-400 font-medium">
                    Fetching your architectural roadmap...
                </div>
            </div>
        </main>
    </div>

    <div id="modal" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[110] flex items-center justify-center p-4">
        <div class="bg-white rounded-[2.5rem] p-8 max-w-lg w-full shadow-2xl">
            <h3 class="text-2xl font-headline font-extrabold mb-6">Add New Deadline</h3>
            <div class="space-y-4 mb-8">
                <input type="text" id="task-title" placeholder="Project Name (e.g. History Paper)" class="w-full p-4 bg-slate-100 border-none rounded-2xl focus:ring-2 focus:ring-blue-500">
                <input type="text" id="task-subject" placeholder="Subject/Course" class="w-full p-4 bg-slate-100 border-none rounded-2xl focus:ring-2 focus:ring-blue-500">
                <input type="datetime-local" id="task-date" class="w-full p-4 bg-slate-100 border-none rounded-2xl focus:ring-2 focus:ring-blue-500">
            </div>
            <div class="flex gap-4">
                <button onclick="closeModal()" class="flex-1 py-4 font-bold text-slate-400">Cancel</button>
                <button onclick="saveNewDeadline()" class="flex-1 py-4 bg-blue-600 text-white rounded-2xl font-bold">Save Deadline</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
